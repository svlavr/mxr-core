name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          changed="$(gofmt -l \
            app/dispatcher/default.go \
            app/dispatcher/tcp_flow_tracker.go \
            app/dispatcher/tcp_flow_tracker_test.go \
            features/routing/tcp_flow.go \
            transport/pipe/impl.go \
            transport/pipe/reader.go \
            transport/pipe/writer.go)"
          if [[ -n "$changed" ]]; then
            echo "$changed"
            exit 1
          fi

      - name: Vet affected packages
        run: go vet ./transport/pipe ./features/routing ./app/dispatcher

      - name: Test affected packages
        run: go test ./transport/pipe ./features/routing ./app/dispatcher

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Race test dispatcher
        run: go test -race ./app/dispatcher

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Test affected packages
        run: go test ./transport/pipe ./features/routing ./app/dispatcher
