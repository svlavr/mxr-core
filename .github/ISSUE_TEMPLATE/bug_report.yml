name: MXR Core bug report
description: Report behavior introduced or changed by this fork
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        MXR Core is an experimental fork. Please report only reproducible core
        behavior and remove credentials, live endpoints, keys, UUIDs, and private
        addresses from all examples.
  - type: input
    id: commit
    attributes:
      label: MXR Core commit
      description: Exact commit SHA used for the reproduction.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Official upstream result
      description: Does the same behavior occur on the baseline from docs/FORK_BASELINE.md?
      options:
        - Fork only
        - Also reproducible upstream
        - Not tested upstream
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest configuration and exact steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Explain what should happen and what happens instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include relevant logs, stack traces, test output, and environment details.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and pull requests for the same behavior.
          required: true
        - label: I removed credentials, live endpoints, keys, UUIDs, and private addresses.
          required: true
